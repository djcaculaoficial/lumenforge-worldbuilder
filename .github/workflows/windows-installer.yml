name: Build Lumenforge Worldbuilder for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "worldbuilder-v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Worldbuilder Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the Worldbuilder source
        run: pnpm check

      - name: Build the isolated Worldbuilder executable and installer
        shell: pwsh
        env:
          LUMENFORGE_SOURCE_REVISION: ${{ github.sha }}
          LUMENFORGE_RELEASE_TAG: ${{ github.ref_name }}
          LUMENFORGE_BUILD_CHANNEL: github-actions
        run: |
          pnpm desktop:build --bundles nsis

      - name: Verify the compiled studio identity and collect release assets
        id: verify
        shell: pwsh
        run: |
          $compiled = (Get-ChildItem "dist/public" -Recurse -File | Where-Object { $_.Extension -in ".js", ".html" } | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          $required = @("WORLDBUILDER", "Items", "Cutscene", "Logic", "lumenforge-worldbuilder-game-package")
          foreach ($marker in $required) {
            if ($compiled -notmatch [regex]::Escape($marker)) { throw "Compiled frontend is missing required marker: $marker" }
          }
          $manifestPath = "dist/public/worldbuilder-verification.json"
          if (-not (Test-Path $manifestPath)) { throw "Build verification manifest is missing." }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.bundleSha256) -or $manifest.bundleSha256.Length -ne 64) { throw "Build verification manifest does not contain a SHA-256 bundle fingerprint." }
          $portable = Get-ChildItem "src-tauri/target/release" -Filter "lumenforge-worldbuilder.exe" -File | Select-Object -First 1
          if (-not $portable) { throw "The portable Worldbuilder executable was not produced." }
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "The NSIS Worldbuilder installer was not produced." }
          $version = node -p "require('./package.json').version"
          $assets = "release-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Copy-Item $portable.FullName "$assets/Lumenforge-Worldbuilder-$version-Portable.exe"
          Copy-Item $installer.FullName "$assets/Lumenforge-Worldbuilder-$version-Setup.exe"
          Copy-Item $manifestPath "$assets/worldbuilder-verification.json"
          Get-FileHash "$assets/*" -Algorithm SHA256 | Format-Table Path,Hash -AutoSize | Out-String | Tee-Object -FilePath "$assets/SHA256SUMS.txt"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload verified Worldbuilder release assets
        uses: actions/upload-artifact@v4
        with:
          name: Lumenforge-Worldbuilder-${{ steps.verify.outputs.version }}-Windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified GitHub release for a Worldbuilder tag
        if: startsWith(github.ref, 'refs/tags/worldbuilder-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Lumenforge Worldbuilder ${{ steps.verify.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
