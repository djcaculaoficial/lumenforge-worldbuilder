name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the web studio
        run: pnpm check

      - name: Build NSIS installer
        run: pnpm desktop:build --bundles nsis

      - name: Build MSI package
        id: msi
        continue-on-error: true
        run: pnpm desktop:build --bundles msi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumenforge-Windows-x64-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload MSI package when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumenforge-Windows-x64-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize the build
        shell: pwsh
        run: |
          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Get-ChildItem "src-tauri/target/release/bundle/nsis" | Format-Table Name,Length
          }
          if ("${{ steps.msi.outcome }}" -ne "success") {
            Write-Warning "The NSIS installer succeeded, but MSI packaging did not. Read the MSI step log for its Windows prerequisite failure."
          }
