name: Build packaged Lumenforge Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Lumenforge x64 setup executable
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out bootstrap repository
        uses: actions/checkout@v4

      - name: Expand packaged Lumenforge source
        shell: pwsh
        run: Expand-Archive -Path "$env:GITHUB_WORKSPACE\Lumenforge-Windows-CI-Ready-Source.zip" -DestinationPath "$env:GITHUB_WORKSPACE\source" -Force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install and validate project dependencies
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Build NSIS installer
        working-directory: source
        run: pnpm desktop:build --bundles nsis

      - name: Upload Lumenforge Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Lumenforge-Windows-x64-NSIS
          path: source/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
